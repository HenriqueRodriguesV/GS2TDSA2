# Perfil de nuvem (Azure Web App). Ativado com SPRING_PROFILES_ACTIVE=cloud.
# Todos os valores sensiveis chegam por variaveis de ambiente, aplicadas pela
# pipeline de Release a partir de variaveis secretas do Azure DevOps.

# Azure SQL Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# O schema e criado exclusivamente pelo scripts/script-bd.sql, executado pela
# Release antes do deploy. O Hibernate apenas confere se o banco bate com as
# entidades e impede a API de subir se houver divergencia.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Console H2 nao existe fora do ambiente local.
spring.h2.console.enabled=false

app.jwt.secret=${JWT_SECRET}
app.bootstrap-gestor.email=${GESTOR_EMAIL}
app.bootstrap-gestor.password=${GESTOR_PASSWORD}

# Sem RabbitMQ na nuvem: o consumidor fica desligado e a API continua
# registrando ocorrencias; a orientacao segue disponivel sob demanda em
# POST /api/ai/ocorrencias/{id}/orientacao.
spring.rabbitmq.listener.simple.auto-startup=false
